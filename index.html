<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12171c">
<title>AraFert</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<h1>AraFert</h1>
<p class="sub">Choose a key and scale, then explore the fretboard.</p>
<div class="card" id="fscard">
<p class="q">Your fretboard</p>
<p class="sub">Tap a fret to play its note</p>
<div class="row" style="margin-bottom:12px;gap:12px">
<label>Musical Key
<select id="fsRoot"></select>
</label>
<label>Your Scale
<select id="fsScale"></select>
</label></div>
<div class="board"><svg id="fsvg" viewBox="0 0 680 190" role="img" aria-label="Playable guitar fretboard"></svg></div>
<div class="row" style="margin-top:12px">
<button class="pill" id="fsDr" aria-pressed="false">Drone: Off</button>
<button class="pill" id="fsHear">Hear the scale</button>
<button class="pill" id="mute" aria-pressed="false">Sound on</button>
</div>
<div class="fb" id="fsfb" aria-live="polite">Your musical journey starts with one little note</div>
</div>
<div class="card" id=helpCard>
<b>How to use</b>
<p class="sub" style="margin:6px 0 0">Tap any fret to hear its note. Pink dots mark the root notes; smaller dots show the selected scale.
</p>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
